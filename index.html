<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orluna</title>
  <meta name="description" content="Orluna makes small, private Android apps.">
  <style>
    :root {
      --bg: #F7F4EF; --card: #FFFFFF; --ink: #1E2326; --muted: #5C6468;
      --line: #E4DED5; --accent: #1F6F6B;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181A; --card: #1C2124; --ink: #EEF0EF; --muted: #A3ABAE; --line: #2B3236; --accent: #6FC7BF; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px 40px; }
    h1 { font-size: 36px; margin: 0 0 6px; letter-spacing: -0.5px; }
    .lead { color: var(--muted); margin: 0 0 36px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
    .app {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 20px; display: block; color: inherit; text-decoration: none;
    }
    .app h3 { margin: 0 0 4px; font-size: 20px; }
    .app p { margin: 0 0 14px; color: var(--muted); }
    .links a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 18px; }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Orluna</h1>
    <p class="lead">Small, private Android apps. No accounts, no tracking of what you enter.</p>

    <h2>Apps</h2>
    <div class="app">
      <h3>Ouncely</h3>
      <p>Pumping tracker and freezer milk stash for exclusive pumping parents.</p>
      <div class="links">
        <a href="/ouncely/">About</a>
        <a href="/ouncely/privacy.html">Privacy policy</a>
      </div>
    </div>

    <footer>
      Contact: <a href="mailto:ouncely.app@gmail.com">ouncely.app@gmail.com</a>
    </footer>
  </main>
</body>
</html>
